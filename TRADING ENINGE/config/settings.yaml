# ---------------------------------------------------------------------------
# Trading Decision Support - main configuration.
# Everything here is editable at runtime from the UI (risk / strategy params)
# or by restart for data provider changes.
# ---------------------------------------------------------------------------
app:
  title: Trading Decision Support
  timezone: America/New_York
  disclaimer: >
    Futures trading involves substantial risk of loss and is not suitable for
    every investor. This application is decision support and educational tooling
    only. It is not financial advice, it does not place orders, and past or
    simulated performance is not indicative of future results.

data:
  # simulated | csv | yahoo  (databento / tradovate / rithmic adapters ship as
  # documented stubs and stay disabled until credentials exist)
  provider: simulated
  csv_dir: ./data/csv
  cache_db: ./data/trading.db
  bar_limit: 4000
  autoload_bars: 1500
  stale_after_seconds: 180
  simulated:
    seed: 360
    include_trades: true     # synthetic tick data -> footprint / delta demo
    include_depth: true      # synthetic book    -> iceberg demo
    trades_per_bar: 60
  csv:
    # auto-detect: "ninjatrader" | "generic" | "auto"
    format: auto
    delimiter: auto
    timezone: America/New_York
  yahoo:
    enabled: false           # opt-in free delayed data; requires: pip install yfinance
    symbols: {MNQ: MNQ=F, MES: MES=F, NQ: NQ=F, ES: ES=F, CL: CL=F, GC: GC=F, ZC: ZC=F}
    poll_seconds: 60

fundamentals:
  calendar: simulated        # simulated | csv
  calendar_csv: ./data/csv/economic_calendar.csv
  news: simulated            # simulated | csv
  news_csv: ./data/csv/headlines.csv
  index_context: simulated   # simulated | yahoo  (VIX, 10Y, DXY via yfinance)
  news_window_minutes: 15
  high_impact_size_multiplier: 0.5

risk:
  account_size: 25000
  risk_mode: dollars         # dollars | percent
  risk_per_trade: 150
  risk_percent: 0.6
  buying_power_per_trade: 9000
  min_rr: 1.5
  stops_enabled: true
  mode: momentum             # momentum | contra_trend | both
  fundamental_weight: 0.4
  technical_weight: 0.6
  daily_max_loss: 450
  max_trades_per_day: 4
  max_consecutive_losses: 3
  max_contracts: 5
  allow_news_window_trades: false

signals:
  threshold: 62
  expiry_bars: 6
  cooldown_bars: 3
  min_stop_ticks: 4
  target_atr_multiple: [1.0, 1.8, 2.8]

backtest:
  commission_per_contract_side: 1.25   # dollars per contract per side
  slippage_ticks: 1
  stop_slippage_ticks: 2
  max_contracts_per_bar: 6             # partial-fill liquidity proxy
  partial_fill_bars: 2
  warmup_bars: 250
  holdout_fraction: 0.2
  breakeven_after_t1: true
  target_fill_fraction: [0.5, 0.25, 0.25]
  walkforward:
    folds: 4
    train_fraction: 0.7

paper:
  poll_seconds: 5
  starting_equity: 25000

journal:
  screenshot_dir: ./data/screenshots
