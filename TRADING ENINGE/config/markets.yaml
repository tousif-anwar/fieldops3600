    name: Micro E-mini Nasdaq-100
    exchange: CME
    root: MNQ
    dollars_per_point: 2.0
    tick_size: 0.25
    margin: 2400
    sector: equity_index
    fundamentals: [VIX, YIELDS, DXY, MEGACAP]
    sim: {start: 20650.0, vol: 0.00042, drift: 0.00002}
