# ---------------------------------------------------------------------------
# Tradable markets. Every entry drives contract specs, tick rounding, sizing
# and the simulated feed. Add or remove markets freely - the UI reads this file.
# dollars_per_point = contract multiplier (MNQ $2/pt, NQ $20/pt, MES $5/pt, ES $50/pt)
# margin is user-editable (initial day-trade margin, USD) and only caps size.
# ---------------------------------------------------------------------------
markets:
