name: Public website

on:
  push:
    paths:
      - website/**
      - docs/**
      - scripts/build-public-site.py
      - scripts/check-public-site.mjs
      - .github/workflows/public-site.yml
      - '**/*.md'
  pull_request:
    paths:
      - website/**
      - docs/**
      - scripts/build-public-site.py
      - scripts/check-public-site.mjs
      - .github/workflows/public-site.yml
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifact to GitHub Pages
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install static renderer
        run: python -m pip install -r website/requirements.txt
      - name: Build product page and documentation
        run: python scripts/build-public-site.py
      - name: Install browser checks
        run: npm ci --prefix website
      - name: Install Chromium
        run: npx --prefix website playwright install --with-deps chromium
      - name: Check base path, links, accessibility, and responsive behavior
        run: npm --prefix website run check
      - name: Preserve QA evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-site-qa
          path: |
            artifacts/landing
            .local/public-site/build-report.json
      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .local/public-site/fieldops3600

  # Building or merging this workflow does not publish the site. A maintainer
  # must explicitly choose publish=true in a manual workflow dispatch.
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: public-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
